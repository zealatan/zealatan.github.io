  <script type="application/json" id="app-files">{"isac_gui.py": "\"\"\"\nISAC-OFDM Digital-Twin Console (tier 1 GUI) - Streamlit app.\n\nONE OFDM frame flows through BOTH sides of an ISAC system:\n  comm side   : TX frame -> channel (delay + CFO + echo + AWGN) -> full\n                synchronized RX (CP-autocorr frac CFO, PSS timing/integer\n                CFO, bit-faithful FFT/CE/EQ/demod golden chain) -> BER/EVM\n  sensing side: the SAME waveform's target echo -> cross-ambiguity\n                range-Doppler map -> range/velocity estimate vs truth\n  twin link   : the fractional-CFO estimator's atan2 is the exact primitive\n                the CORDIC twin block (rtl/cordic_atan2.v) implements - the\n                bit-exact CORDIC model is applied at that point and compared\n                against the floating-point estimate.\n\nSelf-contained for the Pyodide/stlite web build: numpy + matplotlib only,\nno file I/O, imports only from this directory (ofdm/ package + the two\nCORDIC models). Run locally: streamlit run isac_gui.py\n\"\"\"\nimport sys\nfrom pathlib import Path\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport streamlit as st\n\nsys.path.insert(0, str(Path(__file__).parent))\nfrom ofdm import golden_ref as g          # noqa: E402\nfrom ofdm import params as p              # noqa: E402\nfrom ofdm import tx as txmod              # noqa: E402\nfrom ofdm import rx as rxmod              # noqa: E402\nfrom ofdm import channel as ch            # noqa: E402\nfrom ofdm import sensing as sn            # noqa: E402\nfrom cordic_bitexact import cordic_atan2_bitexact  # noqa: E402\n\nst.set_page_config(page_title=\"ISAC-OFDM Digital Twin\", layout=\"wide\")\nst.title(\"ISAC-OFDM Digital-Twin Console\")\nst.caption(\n    \"Tier 1 (algorithm simulator) of the three-tier digital-twin pipeline. \"\n    \"The transceiver is the OFDM system whose RTL is silicon-proven in the \"\n    \"parent project (ZCU216); the downstream RX math here is its bit-faithful \"\n    \"golden model. Tier 2 replays these exact frames against the real RTL \"\n    \"under cocotb+Verilator; tier 3 is the Zedboard.\"\n)\n\n# ---------------- sidebar ----------------\nwith st.sidebar:\n    st.header(\"Waveform\")\n    mod_name = st.selectbox(\"Data modulation\", [\"qpsk\", \"16qam\", \"64qam\", \"256qam\"], index=1)\n    mod_sel = {v: k for k, v in g.MOD_NAMES.items()}[mod_name]\n    fs_mhz = st.number_input(\"Sample rate fs (MHz)\", 1.0, 200.0, 30.72)\n    seed = st.number_input(\"Data seed\", 0, 9999, 42)\n\n    st.header(\"Comm channel\")\n    delay = st.slider(\"Propagation delay (samples)\", 0, 600, 350)\n    cfo_sc = st.slider(\"CFO (subcarrier units)\", -4.0, 4.0, -1.41, 0.01)\n    snr_db = st.slider(\"SNR (dB)\", 0.0, 50.0, 30.0)\n    echo_on = st.checkbox(\"Multipath echo (static)\", True)\n    echo_delay = st.slider(\"Echo delay (samples)\", 1, 31, 24,\n                           disabled=not echo_on)\n    echo_amp = st.slider(\"Echo amplitude\", 0.0, 0.9, 0.3, disabled=not echo_on)\n\n    st.header(\"Sensing target\")\n    carrier_ghz = st.number_input(\"Carrier (GHz, Doppler calc)\", 1.0, 100.0, 28.0)\n    tgt_range = st.slider(\"Target range (m)\", 5.0, 300.0, 60.0)\n    tgt_vel = st.slider(\"Target velocity (m/s)\", -85.0, 85.0, 45.0)\n    tgt_amp = st.slider(\"Reflection amplitude\", 0.05, 1.0, 0.5)\n    sense_snr = st.slider(\"Sensing SNR (dB)\", -5.0, 30.0, 15.0)\n    n_slots = st.slider(\"Coherent slots M (Doppler res)\", 2, 12, 6)\n\nfs = fs_mhz * 1e6\nscs = fs / g.NSC\ncfo_hz = cfo_sc * scs\nfc = carrier_ghz * 1e9\n\n\n# ---------------- cached pipeline ----------------\n@st.cache_data\ndef run_comm(mod_sel, fs, seed, delay, cfo_hz, echo_delay, echo_amp, snr_db):\n    echo = ((echo_delay, echo_amp + 0.0j),) if echo_amp > 0 else ()\n    data_bits, pilot_bits = txmod.make_bits(mod_sel, seed=seed)\n    txo = txmod.build_frame(data_bits, pilot_bits, mod_sel)\n    rx_stream = ch.comm_channel(txo[\"frame\"], fs, delay=delay, cfo_hz=cfo_hz,\n                                echoes=echo, snr_db=snr_db, seed=3)\n    out = rxmod.receive(rx_stream, fs, txo[\"plt\"], txo[\"tx_bits\"], mod_sel)\n    return txo, rx_stream, out\n\n\n@st.cache_data\ndef run_sensing(mod_sel, fs, seed, n_slots, rng_m, vel, fc, amp, snr):\n    train, _ = sn.build_tx_train(n_slots=n_slots, mod_sel=mod_sel, seed=seed)\n    echo = ch.echo_channel(train, fs, rng_m, vel, fc, amp=amp,\n                           snr_db=snr, seed=5)\n    dopp_res = fs / len(train)\n    dopp_axis = np.arange(-18_000.0, 18_000.0 + 1, max(dopp_res / 2.0, 100.0))\n    rd = sn.range_doppler_map(echo, train, fs, dopp_axis, n_range_bins=128)\n    est_r, est_v, peak = sn.estimate_target(rd, dopp_axis, fs, fc)\n    return echo, rd, dopp_axis, est_r, est_v, peak\n\n\neff_echo_amp = echo_amp if echo_on else 0.0\ntxo, rx_stream, out = run_comm(mod_sel, fs, seed, delay, cfo_hz,\n                               echo_delay, eff_echo_amp, snr_db)\n\n# ================= Panel 1 - TX =================\nst.subheader(\"1 \u00b7 TX - one 4160-sample frame (PSS/SSS + 12 data symbols)\")\nc1, c2, c3 = st.columns(3)\nwith c1:\n    fig, ax = plt.subplots(figsize=(4.4, 3.2))\n    k = g.MOD_K[mod_sel]\n    const = [g.mod_qam(txo[\"tx_bits\"][z][n * 2 * k:(n + 1) * 2 * k], mod_sel)\n             for z in range(g.NUM_DATA) for n in range(0, g.NUM_DATA_SC, 4)]\n    const = np.array(const)\n    ax.scatter(const.real, const.imag, s=4, alpha=0.5)\n    ax.set_title(f\"TX constellation ({mod_name})\", fontsize=10)\n    ax.set_aspect(\"equal\"); ax.grid(alpha=0.3)\n    st.pyplot(fig); plt.close(fig)\nwith c2:\n    fig, ax = plt.subplots(figsize=(4.4, 3.2))\n    t_us = np.arange(len(txo[\"frame\"])) / fs * 1e6\n    ax.plot(t_us, np.abs(txo[\"frame\"]), lw=0.5)\n    for s in range(g.NUM_SYN + g.NUM_DATA):\n        ax.axvline((p.PRE_ZEROS + s * g.SYM_LEN) / fs * 1e6,\n                   color=\"gray\", lw=0.4, alpha=0.5)\n    ax.set_title(\"|frame| with symbol boundaries\", fontsize=10)\n    ax.set_xlabel(\"time (\u00b5s)\", fontsize=9)\n    st.pyplot(fig); plt.close(fig)\nwith c3:\n    fig, ax = plt.subplots(figsize=(4.4, 3.2))\n    spec = np.fft.fftshift(np.fft.fft(txo[\"slot\"]))\n    f_axis = np.fft.fftshift(np.fft.fftfreq(len(txo[\"slot\"]), 1 / fs)) / 1e6\n    ax.plot(f_axis, 20 * np.log10(np.abs(spec) + 1e-9), lw=0.4)\n    ax.set_title(\"TX spectrum (dB)\", fontsize=10)\n    ax.set_xlabel(\"freq (MHz)\", fontsize=9)\n    st.pyplot(fig); plt.close(fig)\n\n# ================= Panel 2 - channel =================\nst.subheader(\"2 \u00b7 Channel - what the receiver actually sees\")\nc1, c2 = st.columns([2, 1])\nwith c1:\n    fig, ax = plt.subplots(figsize=(9, 2.6))\n    t_us = np.arange(len(rx_stream)) / fs * 1e6\n    ax.plot(t_us, rx_stream.real, lw=0.4, alpha=0.8, label=\"I\")\n    ax.plot(t_us, rx_stream.imag, lw=0.4, alpha=0.6, label=\"Q\")\n    ax.axvline((delay + p.PRE_ZEROS) / fs * 1e6, color=\"red\", ls=\"--\",\n               lw=1, label=\"true frame start\")\n    ax.legend(fontsize=8); ax.set_xlabel(\"time (\u00b5s)\", fontsize=9)\n    ax.set_title(\"RX stream (delay + CFO + echo + AWGN)\", fontsize=10)\n    st.pyplot(fig); plt.close(fig)\nwith c2:\n    st.metric(\"Applied CFO\", f\"{cfo_hz/1e3:+.2f} kHz\",\n              f\"{cfo_sc:+.2f} subcarriers\")\n    st.metric(\"Delay\", f\"{delay} samples\",\n              f\"{delay / fs * 1e6:.2f} \u00b5s\")\n    if echo_on:\n        st.metric(\"Echo\", f\"{echo_delay} samp / {echo_amp:.2f}\",\n                  \"inside CP\" if echo_delay < g.CP_LEN else \"BEYOND CP!\")\n\n# ================= Panel 3 - RX chain =================\nst.subheader(\"3 \u00b7 RX chain - synchronize, estimate, equalize, decide\")\nc1, c2, c3 = st.columns(3)\nwith c1:\n    fig, ax = plt.subplots(figsize=(4.4, 3.0))\n    mag = out[\"metric_mag\"]\n    t_us = np.arange(len(mag)) / fs * 1e6\n    ax.plot(t_us, mag, lw=0.5)\n    ax.axvline(out[\"start\"] / fs * 1e6, color=\"red\", ls=\"--\", lw=1)\n    ax.set_title(\"CP-autocorr metric + PSS frame start\", fontsize=10)\n    ax.set_xlabel(\"time (\u00b5s)\", fontsize=9)\n    st.pyplot(fig); plt.close(fig)\nwith c2:\n    fig, ax = plt.subplots(figsize=(4.4, 3.0))\n    sym0 = out[\"slot\"][(g.NUM_SYN) * g.SYM_LEN:(g.NUM_SYN) * g.SYM_LEN + g.SYM_LEN]\n    rxSym = g.rx_fft(sym0)\n    Hest = g.hest_shifted(rxSym, txo[\"plt\"][0])\n    ax.plot(np.abs(Hest), lw=0.8)\n    ax.set_title(\"|H(f)| estimate, data symbol 0\", fontsize=10)\n    ax.set_xlabel(\"subcarrier\", fontsize=9)\n    st.pyplot(fig); plt.close(fig)\nwith c3:\n    fig, ax = plt.subplots(figsize=(4.4, 3.0))\n    eq = out[\"eq\"].ravel()\n    ax.scatter(eq.real, eq.imag, s=2, alpha=0.4)\n    ax.set_title(\"Equalized constellation\", fontsize=10)\n    ax.set_aspect(\"equal\"); ax.grid(alpha=0.3)\n    st.pyplot(fig); plt.close(fig)\n\nm1, m2, m3, m4, m5 = st.columns(5)\ntrue_start = delay + p.PRE_ZEROS\nm1.metric(\"Frame start\", out[\"start\"],\n          f\"err {out['start'] - true_start:+d} samp\")\nm2.metric(\"Integer CFO k\", f\"{out['k_int']:+d}\")\nm3.metric(\"Frac CFO \u03b5\", f\"{out['eps_frac']:+.4f}\",\n          f\"est {out['cfo_hz_est']/1e3:+.2f} kHz vs true {cfo_hz/1e3:+.2f}\")\nm4.metric(\"BER\", f\"{out['ber']:.2e}\",\n          \"PASS\" if out[\"ber\"] == 0 else \"ERRORS\", delta_color=\"normal\")\nm5.metric(\"EVM\", f\"{100*out['evm']:.2f} %\")\n\n# ================= Panel 4 - sensing =================\nst.subheader(\"4 \u00b7 Sensing - the same OFDM waveform as radar\")\necho_rx, rd, dopp_axis, est_r, est_v, peak = run_sensing(\n    mod_sel, fs, seed, n_slots, tgt_range, tgt_vel, fc, tgt_amp, sense_snr)\nc1, c2 = st.columns([2, 1])\nwith c1:\n    fig, ax = plt.subplots(figsize=(8, 3.6))\n    r_axis = np.arange(rd.shape[1]) * ch.C_LIGHT / (2 * fs)\n    v_axis = dopp_axis * ch.C_LIGHT / (2 * fc)\n    im = ax.imshow(20 * np.log10(rd + 1e-9), aspect=\"auto\", origin=\"lower\",\n                   extent=[r_axis[0], r_axis[-1], v_axis[0], v_axis[-1]],\n                   cmap=\"viridis\")\n    ax.axvline(tgt_range, color=\"red\", ls=\"--\", lw=0.8, alpha=0.8)\n    ax.axhline(tgt_vel, color=\"red\", ls=\"--\", lw=0.8, alpha=0.8)\n    ax.plot(est_r, est_v, \"wx\", ms=10, mew=2)\n    ax.set_xlabel(\"range (m)\", fontsize=9)\n    ax.set_ylabel(\"velocity (m/s)\", fontsize=9)\n    ax.set_title(\"range-Doppler map - red cross=truth, white x=estimate\",\n                 fontsize=10)\n    fig.colorbar(im, ax=ax, label=\"dB\")\n    st.pyplot(fig); plt.close(fig)\nwith c2:\n    range_bin = ch.C_LIGHT / (2 * fs)\n    v_bin = (fs / (n_slots * g.SLOT_LEN)) * ch.C_LIGHT / (2 * fc)\n    st.metric(\"Range estimate\", f\"{est_r:.1f} m\",\n              f\"err {est_r - tgt_range:+.1f} m (bin {range_bin:.1f})\")\n    st.metric(\"Velocity estimate\", f\"{est_v:+.1f} m/s\",\n              f\"err {est_v - tgt_vel:+.1f} (bin {v_bin:.1f})\")\n    st.metric(\"Coherent duration\", f\"{n_slots * g.SLOT_LEN / fs * 1e3:.2f} ms\")\n\n# ================= Panel 5 - CORDIC twin link =================\nst.subheader(\"5 \u00b7 Digital-twin link - the CORDIC inside this receiver\")\nst.caption(\n    \"The fractional-CFO step above computes atan2 of the CP-autocorrelation \"\n    \"peak. In the RTL that atan2 IS cordic_atan2.v (verified bit-exact by the \"\n    \"CORDIC stage of this twin). Below, the same peak sample is pushed \"\n    \"through the bit-exact CORDIC model instead of floating-point atan2.\"\n)\nmc, mag_c = rxmod.cp_autocorr_metric(rx_stream)\npeak_c = mc[int(np.argmax(mag_c))]\nscale = 2 ** 28 / max(1.0, np.abs(peak_c))\ni_fx = int(np.clip(round(peak_c.real * scale), -2**31, 2**31 - 1))\nq_fx = int(np.clip(round(peak_c.imag * scale), -2**31, 2**31 - 1))\nph_cordic_q15 = cordic_atan2_bitexact(i_fx, q_fx)\nang_float = float(np.angle(peak_c))\nang_cordic = ph_cordic_q15 / 32768.0 * np.pi\neps_f = -ang_float / (2 * np.pi)\neps_c = -ang_cordic / (2 * np.pi)\nerr_lsb = abs(round(ang_float / np.pi * 32768) - ph_cordic_q15)\nerr_lsb = min(err_lsb, 65536 - err_lsb)\n\nc1, c2, c3, c4 = st.columns(4)\nc1.metric(\"float atan2 \u03b5\", f\"{eps_f:+.5f}\")\nc2.metric(\"CORDIC bit-exact \u03b5\", f\"{eps_c:+.5f}\")\nc3.metric(\"Phase error\", f\"{err_lsb} LSB (Q1.15)\", \"vs \u00b12 LSB RTL gate\")\nc4.metric(\"CFO error from CORDIC\", f\"{abs(eps_c - eps_f) * scs:.1f} Hz\")\n\nst.caption(\n    \"Honesty note: tier-1 sync (CP autocorr + PSS search) is an ALGORITHMIC \"\n    \"reference, not a copy of the RTL's Meyr FFT-correlation integer-CFO \"\n    \"core - tier-2 gates compare end-to-end results (frame start, total CFO, \"\n    \"BER), not sync internals. The downstream FFT/CE/EQ/demod chain IS the \"\n    \"parent project's bit-faithful golden model, unchanged.\"\n)\n", "cordic_bitexact.py": "\"\"\"\nBit-exact Python port of rtl/cordic_atan2.v's CORDIC vectoring-mode iteration -\ninteger arithmetic, truncating arithmetic-right-shifts, the same atan lookup table,\nsame quadrant normalization - used to separate two different things that both look\nlike \"error against the floating-point golden model\":\n\n  1. error INTRINSIC to the CORDIC ALGORITHM at N_ITER=14 (truncating micro-rotations,\n     finite-precision LUT) - unavoidable without changing the algorithm itself (more\n     iterations, or rounding instead of truncating shifts).\n  2. error that would mean the RTL doesn't faithfully implement this algorithm (a\n     translation/synthesis bug) - checked by comparing THIS model's prediction to the\n     real RTL's actual output (tier 2, cocotb+Verilator), bit-for-bit, not to the\n     floating-point golden.\n\nPython's `>>` on an arbitrary-precision int is already an arithmetic (sign-preserving,\ntruncate-toward-negative-infinity) shift, which is exactly Verilog's `>>>` on a signed\nreg - so this port needs no masking to replicate the RTL's per-stage arithmetic, as\nlong as inputs stay within the headroom the RTL's own CORDIC_W (+2 guard bits) was\nsized for (see generate_vectors.py's FIXED_SCALE choice).\n\"\"\"\nATAN_LUT = [8192, 4836, 2556, 1297, 651, 326, 163, 82, 41, 20, 10, 5, 3, 1, 1, 0]\nPHASE_WIDTH = 16\nN_ITER = 14  # LATENCY - 1, for the RTL's default LATENCY=15\n\n\ndef cordic_atan2_bitexact(i_int: int, q_int: int) -> int:\n    \"\"\"i_int/q_int: signed INPUT_WIDTH-bit integers. Returns the RTL's predicted\n    exact Q1.15 signed phase output (not an approximation - a bit-exact replica).\"\"\"\n    if i_int >= 0:\n        x, y, z = i_int, q_int, 0\n    elif q_int >= 0:\n        x, y, z = -i_int, -q_int, 32767  # +pi\n    else:\n        x, y, z = -i_int, -q_int, -32768  # -pi\n\n    for j in range(1, N_ITER + 1):\n        atan_j = ATAN_LUT[j - 1]\n        if y < 0:\n            x, y, z = x - (y >> (j - 1)), y + (x >> (j - 1)), z - atan_j\n        else:\n            x, y, z = x + (y >> (j - 1)), y - (x >> (j - 1)), z + atan_j\n\n    # Modular (two's-complement) addition is associative, so wrapping once here at the\n    # end into PHASE_WIDTH bits gives the identical result to wrapping at every stage\n    # the way the RTL's 16-bit signed z_pipe register actually does.\n    z &= (1 << PHASE_WIDTH) - 1\n    if z >= (1 << (PHASE_WIDTH - 1)):\n        z -= 1 << PHASE_WIDTH\n    return z\n", "cordic_ref.py": "\"\"\"\nAlgorithm-simulator (tier 1) reference model for rtl/cordic_atan2.v.\n\nMirrors the RTL's own documented fixed-point contract exactly (see that file's header):\n  phase = atan2(Q, I) encoded as Q1.15 signed fixed-point:\n    0x7FFF = +pi, 0x8000 = -pi, 0x0000 = 0\n    value = round(atan2(Q, I) / pi * 32768), clamped to [-32768, 32767]\n\nPure floating-point math, no RTL, no fixed-point arithmetic error - this is the ground\ntruth both the hardware simulator (tier 2, cocotb+Verilator on the real RTL) and,\neventually, real hardware (tier 3 - see orchestrator/real_hw_adapter.py) are checked\nagainst.\n\"\"\"\nimport math\n\nPHASE_FULL_SCALE = 32768  # 2^15\n\n\ndef atan2_q15(i: float, q: float) -> int:\n    \"\"\"Floating-point atan2(Q, I), scaled to the RTL's Q1.15 phase format.\"\"\"\n    angle = math.atan2(q, i)\n    raw = round(angle / math.pi * PHASE_FULL_SCALE)\n    return max(-32768, min(32767, raw))\n", "ofdm/__init__.py": "\"\"\"\nTier-1 OFDM algorithm simulator for the digital-twin pipeline.\n\nThe base transceiver of this twin is the OFDM system whose RTL lives in\n~/realtime-Gbps-OFDM-for-Wideband/RTL_SYNC_PHASE5 (silicon-proven on ZCU216).\ngolden_ref.py is the bit-faithful downstream chain copied from that project's\nown golden model; tx/channel/rx/sensing build the full ISAC loop around it.\n\"\"\"\n", "ofdm/golden_ref.py": "\"\"\"\nBit-faithful OFDM TX / RX-downstream reference core.\n\nPROVENANCE: copied from\n  ~/realtime-Gbps-OFDM-for-Wideband/RTL_SYNC_PHASE5/scripts/rx_downstream_ref.py\n(the parent project's own golden model, itself ported from the HW-proven C\nreference in ref/transmitter.c / receiver.c / signal_processing_common.c).\nAll arithmetic below is UNCHANGED from that file. What was removed for this\ntwin copy: the golden-vector file dumps, the Data_Bits.txt/Pilot_Bits.txt\nfile loaders (bit sources are injected by the caller here so the model stays\nself-contained \u2014 required for the Pyodide/stlite web build), and the __main__\nregeneration driver. Frame numerology documented in that project's\ngolden/rx_downstream/CONTRACT.md.\n\"\"\"\nimport numpy as np\n\n# ----------------------------------------------------------------------\n# constants (pluto.h / signal_processing_common.c)\n# ----------------------------------------------------------------------\nNSC        = 256\nCP_LEN     = 32\nSYM_LEN    = NSC + CP_LEN            # 288\nNUM_SYN    = 2                       # sync symbols (PSS + SSS)\nNUM_DATA   = 12\nSLOT_LEN   = (NUM_SYN + NUM_DATA) * SYM_LEN   # 4032\nNUM_PILOTS = 32\nNUM_DATA_SC = NSC - NUM_PILOTS - 3   # 221\nQAM16_BPS  = 4\nQPSK_BPS   = 2\nDATA_BITS_PER_BLOCK = NUM_DATA_SC * QAM16_BPS    # 884\nPILOT_BITS_PER_BLOCK = NUM_PILOTS * QPSK_BPS     # 64\n\nSCALE_16QAM = 1.0 / np.sqrt(10.0)\nSCALE_QPSK  = 1.0 / np.sqrt(2.0)\n\nMOD_NAMES = {0: \"qpsk\", 1: \"16qam\", 2: \"64qam\", 3: \"256qam\"}\nMOD_K     = {0: 1, 1: 2, 2: 3, 3: 4}            # bits/axis\nMOD_SCALE = {0: 1.0/np.sqrt(2.0), 1: 1.0/np.sqrt(10.0),\n             2: 1.0/np.sqrt(42.0), 3: 1.0/np.sqrt(170.0)}\n\n# Q15 fixed-point scale of the TX time-domain slot (PAPR headroom: peak ~2.47)\nQ15_SCALE = 8192.0\n# Q15 scale of the spectrum/EQ-domain samples the RTL demod sees\nQ15_DEMOD = 5090.697374\n\n\ndef _gray(n):\n    return n ^ (n >> 1)\n\n\ndef _ungray(g):\n    n = 0\n    while g:\n        n ^= g\n        g >>= 1\n    return n\n\n\ndef axis_bits_to_value(axis_bits, k):\n    \"\"\"k-bit folded-Gray axis code (MSB first = a[0]) -> odd integer level.\"\"\"\n    sign_pos = axis_bits[0]\n    g = 0\n    for b in axis_bits[1:]:\n        g = (g << 1) | int(b)\n    m = _ungray(g)\n    return (2 * m + 1) if sign_pos else -(2 * m + 1)\n\n\ndef value_to_axis_bits(val, k):\n    \"\"\"odd integer level -> k-bit folded-Gray axis code (MSB first).\"\"\"\n    sign_pos = 1 if val > 0 else 0\n    m = (abs(int(val)) - 1) // 2\n    g = _gray(m)\n    bits = [sign_pos]\n    for i in range(k - 2, -1, -1):\n        bits.append((g >> i) & 1)\n    return bits\n\n\ndef mod_qam(bits, mod_sel):\n    \"\"\"bits-per-symbol (2*k) bits -> complex symbol for the given modulation.\n    bits layout [I axis k bits | Q axis k bits], a[0]=sign.\"\"\"\n    k = MOD_K[mod_sel]\n    S = MOD_SCALE[mod_sel]\n    iax = axis_bits_to_value([int(b) for b in bits[0:k]], k)\n    qax = axis_bits_to_value([int(b) for b in bits[k:2 * k]], k)\n    return (iax * S) + 1j * (qax * S)\n\n\ndef demod_qam(sym, mod_sel, q15_scale=Q15_DEMOD):\n    \"\"\"hard-slice a complex sample to 2*k bits (same integer-step rule the\n    RTL uses: STEP=round(2*S*Q15)). Returns [I axis k | Q axis k] bits.\"\"\"\n    k = MOD_K[mod_sel]\n    S = MOD_SCALE[mod_sel]\n    nlev = 1 << k\n    step = round(2 * S * q15_scale)\n\n    def slice_axis(v_float):\n        v = int(round(v_float * q15_scale))\n        sign_pos = 1 if v >= 0 else 0\n        av = abs(v)\n        m = av // step\n        if m > nlev // 2 - 1:\n            m = nlev // 2 - 1\n        lvl = (2 * m + 1) if sign_pos else -(2 * m + 1)\n        return value_to_axis_bits(lvl, k)\n\n    return slice_axis(sym.real) + slice_axis(sym.imag)\n\n\ndef mod_qpsk(bits2):\n    \"\"\"generate_symbol_qpsk\"\"\"\n    si = (1.0 if bits2[0] else -1.0) * SCALE_QPSK\n    sq = (1.0 if bits2[1] else -1.0) * SCALE_QPSK\n    return si + 1j * sq\n\n\n# ----------------------------------------------------------------------\n# index tables\n# ----------------------------------------------------------------------\ndef build_indexes():\n    \"\"\"Reproduce get_pilot_indexes_for_fft_interpolation_toan (transmitter.c).\"\"\"\n    pilot_dist = NSC / NUM_PILOTS                       # 8.0\n    pltIndx = [1 + int(np.floor(i * pilot_dist)) for i in range(NUM_PILOTS)]\n    if pltIndx[-1] > NSC - 1:\n        pltIndx[-1] = NSC - 1\n    dataIndx = []\n    k = 0\n    for i in range(1, NSC - 1):          # 1 .. 254\n        if k < len(pltIndx) and i == pltIndx[k]:\n            k += 1\n        elif i != (NSC // 2):            # skip DC (128)\n            dataIndx.append(i)\n    assert len(dataIndx) == NUM_DATA_SC, len(dataIndx)\n    return pltIndx, dataIndx\n\n\nPLT_INDX, DATA_INDX = build_indexes()\n\n\n# ----------------------------------------------------------------------\n# FFT helpers matching the C / FFTW conventions exactly\n# ----------------------------------------------------------------------\ndef rearrange_spectrum(x):\n    \"\"\"In-place half-swap == np.fft.fftshift for even length (receiver.c).\"\"\"\n    n = len(x)\n    h = n // 2\n    return np.concatenate([x[h:], x[:h]])\n\n\ndef fftw_forward(x):\n    return np.fft.fft(x)            # exp(-j), unnormalized\n\n\ndef fftw_backward(x):\n    return len(x) * np.fft.ifft(x)  # exp(+j), unnormalized\n\n\n# ----------------------------------------------------------------------\n# TX (transmitter.c add_data_in_slot loop)\n# ----------------------------------------------------------------------\ndef tx_modulate_block(data_bits_block, plt_block, mod_sel=1):\n    \"\"\"One OFDM data symbol (288 samples) from the block's data bits + 32\n    QPSK pilots. Returns (sym288, spectrum256).\"\"\"\n    bps = 2 * MOD_K[mod_sel]\n    txSym = np.zeros(NSC, dtype=complex)\n    for i, idx in enumerate(PLT_INDX):\n        txSym[idx] = plt_block[i]\n    for k, idx in enumerate(DATA_INDX):\n        b = data_bits_block[k * bps:(k + 1) * bps]\n        txSym[idx] = mod_qam(b, mod_sel)\n    spec = rearrange_spectrum(txSym)\n    body = fftw_backward(spec) / np.sqrt(NSC)\n    sym = np.concatenate([body[NSC - CP_LEN:], body])\n    return sym, txSym\n\n\n# ----------------------------------------------------------------------\n# RX downstream chain (receiver.c process_received_slot)\n# ----------------------------------------------------------------------\ndef rx_fft(sym288):\n    \"\"\"generate_complex_symbol (drop CP) + fft_with_rearrange.\"\"\"\n    body = sym288[CP_LEN:CP_LEN + NSC]\n    spec = fftw_forward(body)\n    spec = rearrange_spectrum(spec)\n    return spec / np.sqrt(NSC)\n\n\ndef ch_estimation_fdm(rxSym, plt_block):\n    \"\"\"receiver.c ch_estimation_fdm: H over 256 bins, pilot bins only.\"\"\"\n    H = np.zeros(NSC, dtype=complex)\n    for k, i in enumerate(PLT_INDX):\n        p = plt_block[k]\n        tmp = (p.real * p.real + p.imag * p.imag)\n        Hi = (rxSym[i].real * p.real + rxSym[i].imag * p.imag) / tmp\n        Hq = (rxSym[i].imag * p.real - rxSym[i].real * p.imag) / tmp\n        H[i] = Hi + 1j * Hq\n    return H\n\n\ndef interp_fft(H_pilots):\n    \"\"\"receiver.c interp_fft: pilot-H -> 32-pt IFFT -> zero-pad -> 256-pt FFT.\"\"\"\n    mid = NSC // 2\n    hi = np.zeros(NSC, dtype=complex)\n    for i in range(NUM_PILOTS):\n        hi[mid + i] = H_pilots[PLT_INDX[i]]\n    pilot_in = hi[mid:mid + NUM_PILOTS]\n    pilot_out = fftw_backward(pilot_in) / NUM_PILOTS\n    hnew = np.zeros(NSC, dtype=complex)\n    hnew[:NUM_PILOTS] = pilot_out\n    th = min(NUM_PILOTS, CP_LEN)\n    hnew[th:] = 0.0\n    return fftw_forward(hnew)\n\n\ndef fde_zf(rxSym, H):\n    \"\"\"receiver.c fde ZF: out = rxSym*conj(H)/|H|^2.\"\"\"\n    out = np.zeros(NSC, dtype=complex)\n    for i in range(NSC):\n        ri, rq = rxSym[i].real, rxSym[i].imag\n        hi, hq = H[i].real, H[i].imag\n        oi = ri * hi + rq * hq\n        oq = rq * hi - ri * hq\n        sc = hi * hi + hq * hq\n        if sc == 0.0:\n            out[i] = 0.0\n        else:\n            out[i] = (oi / sc) + 1j * (oq / sc)\n    return out\n\n\ndef hest_shifted(rxSym, plt_block):\n    \"\"\"The Hest array (post +1 memcpy shift) actually consumed by fde:\n    Hest[1:255] = interp_fft(...)[0:254]; Hest[0]=Hest[255]=0.\"\"\"\n    Hp = ch_estimation_fdm(rxSym, plt_block)\n    H = interp_fft(Hp)\n    Hest = np.zeros(NSC, dtype=complex)\n    Hest[1:1 + (NSC - 2)] = H[0:NSC - 2]\n    return Hest\n\n\n# ----------------------------------------------------------------------\n# Q15 helpers (RTL interface packing)\n# ----------------------------------------------------------------------\ndef to_q15(x, scale=Q15_SCALE):\n    v = int(np.round(x * scale))\n    return max(-32768, min(32767, v))\n\n\ndef pack_iq_q15(i_f, q_f, scale=Q15_SCALE):\n    \"\"\"M_AXIS packing {Q[31:16], I[15:0]} -> 32-bit hex string.\"\"\"\n    i = to_q15(i_f, scale) & 0xFFFF\n    q = to_q15(q_f, scale) & 0xFFFF\n    return f\"{((q << 16) | i) & 0xFFFFFFFF:08X}\"\n", "ofdm/params.py": "\"\"\"\nFrame-level numerology + PSS/SSS sync-symbol construction.\n\nConstants and sequence math ported from the parent project's C reference\n(ref/signal_processing_common.c, ref/dump_p5_d1.c, ref/transmitter.c\ngenerate_transmit_slot) and its golden/p5_wrapper_fullchain/manifest.json:\n  - PSS = m-sequence  (x[i]=x[i-3]+x[i-7], x_init=1110110, Nid_2=2)\n  - SSS = gold sequence (x0,x1 recurrences, Nid_1=170, Nid_2=2)\n  - both BPSK, seqLen=127, placed on FREQUENCY bins [55 .. 55+127) of the\n    256-bin IDFT input (NO fftshift on the sync path, unlike the data path),\n    amplitude sqrt(NSC/seqLen); then idft()/sqrt(N) and a 32-sample CP.\n  - board-level frame: 64 pre-zeros + 4032 slot + 64 post-zeros = 4160.\n\"\"\"\nimport numpy as np\n\nfrom . import golden_ref as g\n\nSEQ_LEN    = 127\nSYNC_START = 55          # syncSigStartIndex\nNID_1      = 170\nNID_2      = 2\nPRE_ZEROS  = 64\nPOST_ZEROS = 64\nTOTAL_LEN  = PRE_ZEROS + g.SLOT_LEN + POST_ZEROS   # 4160\n\n\ndef m_seq(seq_len=SEQ_LEN, nid_2=NID_2):\n    \"\"\"PSS m-sequence, real BPSK, amplitude sqrt(NSC/len) (dump_p5_d1.c).\"\"\"\n    x = np.zeros(seq_len, dtype=int)\n    x_init = [1, 1, 1, 0, 1, 1, 0]\n    for i in range(seq_len):\n        x[i] = x_init[i] if i < 7 else (x[i - 3] + x[i - 7]) % 2\n    amp = np.sqrt(g.NSC / seq_len)\n    out = np.zeros(seq_len)\n    for n in range(seq_len):\n        m = (n + 43 * nid_2) % seq_len\n        out[n] = -(1 - 2 * x[m]) * amp\n    return out\n\n\ndef gold_seq(seq_len=SEQ_LEN, nid_1=NID_1, nid_2=NID_2):\n    \"\"\"SSS gold sequence, real BPSK, amplitude sqrt(NSC/len) (dump_p5_d1.c).\"\"\"\n    x0 = np.zeros(seq_len, dtype=int)\n    x1 = np.zeros(seq_len, dtype=int)\n    for i in range(seq_len):\n        if i < 7:\n            x0[i] = [0, 0, 0, 0, 0, 0, 1][i]\n            x1[i] = [0, 0, 0, 0, 0, 0, 1][i]\n        else:\n            x0[i] = (x0[i - 3] + x0[i - 7]) % 2\n            x1[i] = (x1[i - 6] + x1[i - 7]) % 2\n    amp = np.sqrt(g.NSC / seq_len)\n    m0 = 15 * int(np.floor(nid_1 / 112.0)) + 5 * nid_2\n    m1 = nid_1 % 112\n    out = np.zeros(seq_len)\n    for n in range(seq_len):\n        out[n] = (1 - 2 * x0[(n + m0) % seq_len]) \\\n               * (1 - 2 * x1[(n + m1) % seq_len]) * amp\n    return out\n\n\ndef _sync_symbol(seq):\n    \"\"\"Frequency bins [SYNC_START..SYNC_START+127) <- seq (no fftshift),\n    idft()/sqrt(N) (== fftw_backward/sqrt(N)), prepend CP. Returns 288.\"\"\"\n    spec = np.zeros(g.NSC, dtype=complex)\n    spec[SYNC_START:SYNC_START + len(seq)] = seq\n    body = g.fftw_backward(spec) / np.sqrt(g.NSC)\n    return np.concatenate([body[g.NSC - g.CP_LEN:], body])\n\n\ndef pss_symbol():\n    return _sync_symbol(m_seq())\n\n\ndef sss_symbol():\n    return _sync_symbol(gold_seq())\n", "ofdm/tx.py": "\"\"\"\nOFDM TX: bits -> full 4160-sample frame (PSS/SSS + 12 data symbols).\n\nFrame assembly mirrors transmitter.c generate_transmit_slot: symbol 0 = PSS\n(m-seq), symbol 1 = SSS (gold-seq), symbols 2..13 = data (golden_ref\ntx_modulate_block), then 64 pre/post zeros (board framing, manifest.json).\n\nBit sources are injected (seeded RNG by default) instead of the C reference's\nData_Bits.txt/Pilot_Bits.txt files, so the model is self-contained for the\nweb (Pyodide) build. For a tier-2 comparison against the RTL's committed\ngolden, pass the file bits in explicitly.\n\"\"\"\nimport numpy as np\n\nfrom . import golden_ref as g\nfrom . import params as p\n\n\ndef make_bits(mod_sel=1, seed=42):\n    \"\"\"Deterministic (seeded) data + pilot bits for one frame.\"\"\"\n    k = g.MOD_K[mod_sel]\n    n_data = g.NUM_DATA_SC * 2 * k * g.NUM_DATA\n    n_pilot = g.PILOT_BITS_PER_BLOCK * g.NUM_DATA\n    rng = np.random.default_rng(seed)\n    return rng.integers(0, 2, n_data), rng.integers(0, 2, n_pilot)\n\n\ndef pilot_symbols(pilot_bits):\n    \"\"\"32 QPSK pilots x 12 data symbols (always QPSK, used by CE).\"\"\"\n    plt = np.zeros((g.NUM_DATA, g.NUM_PILOTS), dtype=complex)\n    for z in range(g.NUM_DATA):\n        for i in range(g.NUM_PILOTS):\n            b = (z * g.NUM_PILOTS + i) * g.QPSK_BPS\n            plt[z, i] = g.mod_qpsk(pilot_bits[b:b + g.QPSK_BPS])\n    return plt\n\n\ndef build_frame(data_bits, pilot_bits, mod_sel=1):\n    \"\"\"Returns dict: frame(4160 complex), slot(4032), tx_bits(12,bits/sym),\n    plt(12,32), tx_specs(12,256).\"\"\"\n    k = g.MOD_K[mod_sel]\n    bps_blk = g.NUM_DATA_SC * 2 * k\n    plt = pilot_symbols(pilot_bits)\n\n    slot = np.zeros(g.SLOT_LEN, dtype=complex)\n    slot[0:g.SYM_LEN] = p.pss_symbol()\n    slot[g.SYM_LEN:2 * g.SYM_LEN] = p.sss_symbol()\n\n    tx_bits = np.zeros((g.NUM_DATA, bps_blk), dtype=int)\n    tx_specs = np.zeros((g.NUM_DATA, g.NSC), dtype=complex)\n    for z in range(g.NUM_DATA):\n        blk = np.asarray(data_bits[z * bps_blk:(z + 1) * bps_blk], dtype=int)\n        tx_bits[z] = blk\n        sym, spec = g.tx_modulate_block(blk, plt[z], mod_sel)\n        tx_specs[z] = spec\n        off = (g.NUM_SYN + z) * g.SYM_LEN\n        slot[off:off + g.SYM_LEN] = sym\n\n    frame = np.concatenate([np.zeros(p.PRE_ZEROS, dtype=complex), slot,\n                            np.zeros(p.POST_ZEROS, dtype=complex)])\n    return {\"frame\": frame, \"slot\": slot, \"tx_bits\": tx_bits,\n            \"plt\": plt, \"tx_specs\": tx_specs, \"mod_sel\": mod_sel}\n\n\ndef demod_slot_aligned(slot, plt, tx_bits, mod_sel=1):\n    \"\"\"Golden downstream chain on an ALIGNED slot (no sync search):\n    per data symbol FFT -> CE -> ZF EQ -> demod. Returns (rx_bits, ber, evm).\"\"\"\n    k = g.MOD_K[mod_sel]\n    bps_blk = g.NUM_DATA_SC * 2 * k\n    rx_bits = np.zeros((g.NUM_DATA, bps_blk), dtype=int)\n    evm_acc, evm_cnt = 0.0, 0\n    eq_all = np.zeros((g.NUM_DATA, g.NUM_DATA_SC), dtype=complex)\n    for z in range(g.NUM_DATA):\n        off = (g.NUM_SYN + z) * g.SYM_LEN\n        rxSym = g.rx_fft(slot[off:off + g.SYM_LEN])\n        Hest = g.hest_shifted(rxSym, plt[z])\n        eq = g.fde_zf(rxSym, Hest)\n        eqdata = np.array([eq[i] for i in g.DATA_INDX])\n        eq_all[z] = eqdata\n        ideal = np.array([g.mod_qam(tx_bits[z][n * 2 * k:(n + 1) * 2 * k], mod_sel)\n                          for n in range(g.NUM_DATA_SC)])\n        evm_acc += np.sum(np.abs(eqdata - ideal) ** 2)\n        evm_cnt += len(ideal)\n        for n in range(g.NUM_DATA_SC):\n            rx_bits[z][n * 2 * k:(n + 1) * 2 * k] = g.demod_qam(eqdata[n], mod_sel)\n    nerr = int(np.sum(tx_bits != rx_bits))\n    ber = nerr / tx_bits.size\n    ideal_pow = 1.0  # unit average symbol power by MOD_SCALE construction\n    evm = np.sqrt(evm_acc / evm_cnt) / np.sqrt(ideal_pow)\n    return rx_bits, ber, evm, eq_all\n\n\ndef _selftest():\n    ok = True\n    for mod_sel in range(4):\n        data_bits, pilot_bits = make_bits(mod_sel, seed=42)\n        txo = build_frame(data_bits, pilot_bits, mod_sel)\n        _, ber, evm, _ = demod_slot_aligned(txo[\"slot\"], txo[\"plt\"],\n                                            txo[\"tx_bits\"], mod_sel)\n        peak = np.max(np.abs(np.concatenate([txo[\"frame\"].real, txo[\"frame\"].imag])))\n        print(f\"[tx-selftest] {g.MOD_NAMES[mod_sel]:>6}: \"\n              f\"bits={txo['tx_bits'].size} BER={ber:.3e} \"\n              f\"EVM={100*evm:.4f}% peak={peak:.3f}\")\n        if ber != 0.0:\n            ok = False\n    assert len(build_frame(*make_bits(1), 1)[\"frame\"]) == p.TOTAL_LEN\n    print(\"[tx-selftest]\", \"PASS (all modulations BER=0, identity channel)\"\n          if ok else \"FAIL\")\n    raise SystemExit(0 if ok else 1)\n\n\nif __name__ == \"__main__\":\n    _selftest()\n", "ofdm/channel.py": "\"\"\"\nISAC channel models.\n\ncomm_channel : what the COMMUNICATION receiver sees \u2014 direct path with a\n  propagation delay, optional multipath echo(es), carrier-frequency offset,\n  AWGN at a given SNR.\n\necho_channel : what the monostatic SENSING receiver sees \u2014 the target\n  reflection only: round-trip delay from range, Doppler from radial\n  velocity at the given carrier, reflection amplitude, AWGN.\n\nAll delays are integer samples (fractional-delay interpolation is out of\nscope for this tier-1 model and would not change the RTL gate comparison,\nwhich replays integer-sample-aligned vectors).\n\"\"\"\nimport numpy as np\n\nC_LIGHT = 3.0e8\n\n\ndef _awgn(x, snr_db, rng):\n    \"\"\"Add complex AWGN at snr_db relative to the mean power of the nonzero\n    span of x.\"\"\"\n    if snr_db is None:\n        return x\n    live = np.abs(x) > 0\n    sig_pow = np.mean(np.abs(x[live]) ** 2) if np.any(live) else 1.0\n    noise_pow = sig_pow / (10.0 ** (snr_db / 10.0))\n    n = (rng.standard_normal(len(x)) + 1j * rng.standard_normal(len(x))) \\\n        * np.sqrt(noise_pow / 2.0)\n    return x + n\n\n\ndef comm_channel(frame, fs, delay=0, cfo_hz=0.0, echoes=(), snr_db=None,\n                 seed=0, tail=512):\n    \"\"\"Direct path + optional echoes + CFO + AWGN.\n    echoes: iterable of (delay_samples, complex_amp).\n    Returns rx stream of length delay + len(frame) + tail.\"\"\"\n    n_out = int(delay) + len(frame) + tail\n    rx = np.zeros(n_out, dtype=complex)\n    rx[delay:delay + len(frame)] += frame\n    for d, a in echoes:\n        d = int(d)\n        rx[delay + d:delay + d + len(frame)] += a * frame[:max(0, n_out - delay - d)]\n    t = np.arange(n_out) / fs\n    rx = rx * np.exp(1j * 2 * np.pi * cfo_hz * t)\n    rng = np.random.default_rng(seed)\n    return _awgn(rx, snr_db, rng)\n\n\ndef target_echo_params(range_m, vel_mps, carrier_hz, fs):\n    \"\"\"Round-trip delay (samples, int) and Doppler shift (Hz).\"\"\"\n    delay_s = 2.0 * range_m / C_LIGHT\n    doppler_hz = 2.0 * vel_mps * carrier_hz / C_LIGHT\n    return int(round(delay_s * fs)), doppler_hz\n\n\ndef echo_channel(frame, fs, range_m, vel_mps, carrier_hz, amp=0.5,\n                 snr_db=None, seed=0, tail=512):\n    \"\"\"Monostatic sensing return: delayed, Doppler-shifted, scaled copy.\"\"\"\n    delay, doppler_hz = target_echo_params(range_m, vel_mps, carrier_hz, fs)\n    n_out = delay + len(frame) + tail\n    rx = np.zeros(n_out, dtype=complex)\n    rx[delay:delay + len(frame)] = amp * frame\n    t = np.arange(n_out) / fs\n    rx = rx * np.exp(1j * 2 * np.pi * doppler_hz * t)\n    rng = np.random.default_rng(seed)\n    return _awgn(rx, snr_db, rng)\n", "ofdm/rx.py": "\"\"\"\nOFDM RX with synchronization, feeding the bit-faithful golden downstream.\n\nSync algorithm (tier-1 choice \u2014 HONESTY NOTE: this is NOT the same\nalgorithm as the RTL's Meyr FFT-correlation integer-CFO core. The RTL gate\nin tier 2 must therefore compare END-TO-END results (frame start, total CFO,\nBER), not intermediate sync internals. The downstream chain after sync IS\nthe bit-faithful golden_ref, matching receiver.c):\n\n  1. coarse timing + fractional CFO : CP autocorrelation (VanDeBeek) \u2014\n     r[n]*conj(r[n+NSC]) summed over a CP-length window; the metric peaks\n     where CP structure aligns, and its phase/(2*pi) is the fractional CFO\n     in subcarrier units. The angle() here is the SAME atan2 primitive the\n     CORDIC twin block (cordic_atan2.v / frac_cfo_estimator) implements.\n  2. joint integer-CFO + fine timing : after frac correction, cross-\n     correlate against the known PSS time symbol under each integer-CFO\n     hypothesis k in [-K..K]; best |peak| wins.\n  3. correct total CFO, slice the 4032 slot, run the golden downstream\n     (FFT -> CE -> ZF EQ -> demod) -> bits, BER, EVM.\n\"\"\"\nimport numpy as np\n\nfrom . import golden_ref as g\nfrom . import params as p\nfrom . import tx as txmod\n\n\ndef cp_autocorr_metric(rx):\n    \"\"\"Sliding CP autocorrelation: m[n] = sum_{i<CP} rx[n+i]*conj(rx[n+i+NSC]).\n    Returns (metric complex array, normalized magnitude).\"\"\"\n    n_lag = len(rx) - g.NSC - g.CP_LEN\n    if n_lag <= 0:\n        raise ValueError(\"rx too short for CP autocorrelation\")\n    prod = rx[:n_lag + g.CP_LEN] * np.conj(rx[g.NSC:g.NSC + n_lag + g.CP_LEN])\n    c = np.cumsum(np.concatenate([[0.0 + 0.0j], prod]))\n    m = c[g.CP_LEN:] - c[:-g.CP_LEN]\n    pw = np.cumsum(np.concatenate([[0.0], np.abs(rx) ** 2]))\n    e1 = pw[g.CP_LEN:n_lag + g.CP_LEN] - pw[:n_lag]\n    e2 = pw[g.NSC + g.CP_LEN:g.NSC + n_lag + g.CP_LEN] - pw[g.NSC:g.NSC + n_lag]\n    norm = np.sqrt(e1 * e2) + 1e-12\n    return m[:n_lag], np.abs(m[:n_lag]) / norm\n\n\ndef frac_cfo_from_autocorr(m_peak, atan2_fn=None):\n    \"\"\"eps_frac (subcarrier units) = -angle(m)/2pi \u2014 the C reference's\n    VanDeBeek convention (-atan2(Q,I)/2pi): the CP product r[n]*conj(r[n+N])\n    rotates by -2pi*eps, so the estimate negates the measured angle.\n    atan2_fn(q,i) in radians may be substituted (e.g. the CORDIC bit-exact\n    model) for the twin link.\"\"\"\n    if atan2_fn is None:\n        ang = np.angle(m_peak)\n    else:\n        ang = atan2_fn(m_peak.imag, m_peak.real)\n    return -ang / (2.0 * np.pi)\n\n\ndef synchronize(rx, fs, int_cfo_search=8, atan2_fn=None):\n    \"\"\"Full sync: returns dict(start, eps_frac, k_int, cfo_hz_est, metric).\"\"\"\n    scs = fs / g.NSC\n\n    # -- 1. fractional CFO from the strongest CP autocorrelation peak -------\n    # (every OFDM symbol's CP carries the same CFO phase, so WHICH symbol\n    # peaks doesn't matter for eps_frac; timing comes from the PSS below)\n    m, mag = cp_autocorr_metric(rx)\n    coarse = int(np.argmax(mag))\n    # single-point estimate at the metric maximum (VanDeBeek): off-peak\n    # window samples mix in data self-correlation and bias the angle\n    eps_frac = frac_cfo_from_autocorr(m[coarse], atan2_fn)\n\n    t = np.arange(len(rx)) / fs\n    rx_f = rx * np.exp(-1j * 2 * np.pi * (eps_frac * scs) * t)\n\n    # -- 2. joint integer CFO + frame timing via PSS cross-correlation ------\n    # over the WHOLE stream (the PSS is unique in the frame, unlike the CP\n    # structure, so a global argmax is unambiguous)\n    pss = p.pss_symbol()                       # 288 samples, known waveform\n    best = (None, -1.0, 0)                     # (start, |peak|, k)\n    for k in range(-int_cfo_search, int_cfo_search + 1):\n        seg = rx_f * np.exp(-1j * 2 * np.pi * (k * scs) * t)\n        c = np.correlate(seg, pss, mode=\"valid\")\n        i = int(np.argmax(np.abs(c)))\n        if np.abs(c[i]) > best[1]:\n            best = (i, float(np.abs(c[i])), k)\n    start, _, k_int = best\n\n    cfo_hz_est = (k_int + eps_frac) * scs\n    return {\"start\": start, \"eps_frac\": eps_frac, \"k_int\": k_int,\n            \"cfo_hz_est\": cfo_hz_est, \"metric_mag\": mag, \"coarse\": coarse}\n\n\ndef receive(rx, fs, plt, tx_bits, mod_sel=1, int_cfo_search=8, atan2_fn=None):\n    \"\"\"Sync + golden downstream demod. Returns dict with sync info, bits,\n    ber, evm, eq constellation.\"\"\"\n    sync = synchronize(rx, fs, int_cfo_search, atan2_fn)\n    t = np.arange(len(rx)) / fs\n    rx_c = rx * np.exp(-1j * 2 * np.pi * sync[\"cfo_hz_est\"] * t)\n    start = sync[\"start\"]\n    if start + g.SLOT_LEN > len(rx_c):\n        raise ValueError(\"sync start leaves truncated slot\")\n    slot = rx_c[start:start + g.SLOT_LEN]\n    rx_bits, ber, evm, eq_all = txmod.demod_slot_aligned(slot, plt, tx_bits,\n                                                         mod_sel)\n    return {**sync, \"rx_bits\": rx_bits, \"ber\": ber, \"evm\": evm,\n            \"eq\": eq_all, \"slot\": slot}\n\n\ndef _selftest():\n    from . import channel as ch\n    fs = 30.72e6\n    scs = fs / g.NSC                           # 120 kHz\n    mod_sel = 1\n    data_bits, pilot_bits = txmod.make_bits(mod_sel, seed=7)\n    txo = txmod.build_frame(data_bits, pilot_bits, mod_sel)\n\n    cases = [\n        (\"delay0_cfo0\",      0,    0.0,          None),\n        (\"delay137_cfo0\",    137,  0.0,          None),\n        (\"delay500_frac\",    500,  0.31 * scs,   40.0),\n        (\"delay211_int+frac\", 211, (3 + 0.27) * scs, 40.0),\n        (\"delay350_neg\",     350, -(2 + 0.41) * scs, 35.0),\n    ]\n    ok = True\n    for name, delay, cfo, snr in cases:\n        rx = ch.comm_channel(txo[\"frame\"], fs, delay=delay, cfo_hz=cfo,\n                             snr_db=snr, seed=3)\n        out = receive(rx, fs, txo[\"plt\"], txo[\"tx_bits\"], mod_sel)\n        true_start = delay + p.PRE_ZEROS\n        cfo_err = abs(out[\"cfo_hz_est\"] - cfo)\n        t_err = out[\"start\"] - true_start\n        passed = (out[\"ber\"] == 0.0 and cfo_err < 0.01 * scs and\n                  abs(t_err) <= g.CP_LEN // 2)\n        ok &= passed\n        print(f\"[rx-selftest] {name:>17}: start={out['start']}\"\n              f\" (true {true_start}, err {t_err:+d}) \"\n              f\"k_int={out['k_int']:+d} eps={out['eps_frac']:+.4f} \"\n              f\"cfo_err={cfo_err:7.1f} Hz  BER={out['ber']:.3e} \"\n              f\"{'PASS' if passed else 'FAIL'}\")\n    print(\"[rx-selftest]\", \"PASS\" if ok else \"FAIL\")\n    raise SystemExit(0 if ok else 1)\n\n\nif __name__ == \"__main__\":\n    _selftest()\n", "ofdm/sensing.py": "\"\"\"\nISAC sensing: monostatic range-Doppler estimation using the OFDM comm\nwaveform itself as the radar waveform.\n\nProcessor = cross-ambiguity (matched-filter bank over Doppler hypotheses),\nFFT-based fast correlation. The receiver is assumed time-synchronous with\nits own transmitter (monostatic), so the correlation lag axis IS absolute\nround-trip delay \u2014 no comm-style frame sync involved.\n\nResolutions (fs = sample rate, T_obs = coherent train duration):\n  range bin  : c / (2 * fs)                     (~4.9 m at 30.72 Msps)\n  Doppler res: ~1 / T_obs Hz across the train   (M slots -> M*4032/fs s)\n\"\"\"\nimport numpy as np\n\nfrom . import golden_ref as g\nfrom . import tx as txmod\nfrom .channel import C_LIGHT, target_echo_params\n\n\ndef build_tx_train(n_slots=8, mod_sel=1, seed=42):\n    \"\"\"M back-to-back slots (different data per slot, same frame format).\n    Returns (train complex array, list of per-slot tx dicts).\"\"\"\n    slots = []\n    frames = []\n    for m in range(n_slots):\n        data_bits, pilot_bits = txmod.make_bits(mod_sel, seed=seed + m)\n        txo = txmod.build_frame(data_bits, pilot_bits, mod_sel)\n        slots.append(txo)\n        frames.append(txo[\"slot\"])\n    return np.concatenate(frames), slots\n\n\ndef range_doppler_map(rx, tx_ref, fs, doppler_axis_hz, n_range_bins=256):\n    \"\"\"|cross-ambiguity| over (doppler hypothesis, delay 0..n_range_bins).\"\"\"\n    L = 1 << int(np.ceil(np.log2(len(rx) + len(tx_ref))))\n    TX = np.conj(np.fft.fft(tx_ref, L))\n    t = np.arange(len(rx)) / fs\n    rd = np.zeros((len(doppler_axis_hz), n_range_bins))\n    for di, fd in enumerate(doppler_axis_hz):\n        y = rx * np.exp(-1j * 2 * np.pi * fd * t)\n        c = np.fft.ifft(np.fft.fft(y, L) * TX)\n        rd[di] = np.abs(c[:n_range_bins])\n    return rd\n\n\ndef estimate_target(rd, doppler_axis_hz, fs, carrier_hz):\n    \"\"\"Peak of the map -> (range_m, velocity_mps, (di, ri)).\"\"\"\n    di, ri = np.unravel_index(np.argmax(rd), rd.shape)\n    rng_m = ri * C_LIGHT / (2.0 * fs)\n    fd = doppler_axis_hz[di]\n    vel = fd * C_LIGHT / (2.0 * carrier_hz)\n    return rng_m, vel, (int(di), int(ri))\n\n\ndef _selftest():\n    from . import channel as ch\n    fs = 30.72e6\n    fc = 28.0e9\n    n_slots = 8\n    train, _ = build_tx_train(n_slots=n_slots, mod_sel=1, seed=11)\n    t_obs = len(train) / fs\n    dopp_res = 1.0 / t_obs\n    range_bin = C_LIGHT / (2.0 * fs)\n\n    cases = [\n        (\"r60_v45\",   60.0,  45.0, 20.0),\n        (\"r120_v-80\", 120.0, -80.0, 15.0),\n        (\"r25_v0\",    25.0,   0.0, 10.0),\n    ]\n    ok = True\n    for name, rng_m, vel, snr in cases:\n        rx = ch.echo_channel(train, fs, rng_m, vel, fc, amp=0.5,\n                             snr_db=snr, seed=5)\n        fd_true = 2.0 * vel * fc / C_LIGHT\n        dopp_axis = np.arange(-18_000.0, 18_000.0 + 1, dopp_res / 2.0)\n        rd = range_doppler_map(rx, train, fs, dopp_axis)\n        est_r, est_v, _ = estimate_target(rd, dopp_axis, fs, fc)\n        v_bin = dopp_res * C_LIGHT / (2.0 * fc)\n        r_err, v_err = abs(est_r - rng_m), abs(est_v - vel)\n        passed = r_err <= range_bin and v_err <= v_bin\n        ok &= passed\n        print(f\"[sensing-selftest] {name:>9}: est=({est_r:6.1f} m, {est_v:+7.1f} m/s)\"\n              f\" true=({rng_m:6.1f}, {vel:+7.1f})  err=({r_err:.2f} m, {v_err:.2f} m/s)\"\n              f\"  bins=({range_bin:.2f} m, {v_bin:.2f} m/s) \"\n              f\"{'PASS' if passed else 'FAIL'}\")\n    print(\"[sensing-selftest]\", \"PASS\" if ok else \"FAIL\")\n    raise SystemExit(0 if ok else 1)\n\n\nif __name__ == \"__main__\":\n    _selftest()\n"}</script>
